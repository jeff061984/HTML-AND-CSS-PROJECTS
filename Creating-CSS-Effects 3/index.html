<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Effects</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CSS Effects</h1>
        <p class="subtitle">My CSS Effects Project</p>

        <!-- Hover Button -->
        <section>
            <h2>1. Hover Effect</h2>

            <button class="hover-button">
                Hover Me
            </button>
        </section>

        <!-- Shadow Effect -->
        <section>
            <h2>2. Box Shadow Effect</h2>

            <div class="shadow-box">
                CSS Shadow
            </div>
        </section>

        <!-- Transform Effect -->
        <section>
            <h2>3. Transform Effect</h2>

            <div class="transform-box">
                Hover Me
            </div>
        </section>

        <!-- Animation Effect -->
        <section>
            <h2>4. Animation Effect</h2>

            <div class="animation-box">
                CSS Animation
            </div>
        </section>

        <!-- Text Effect -->
        <section>
            <h2>5. Text Effect</h2>

            <p class="glow-text">
                Welcome to CSS Effects!
            </p>
        </section>

    </div>

</body>
</html>
